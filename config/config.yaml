game:
  rule: "tic_tac_toe"  # "connect6" で六目並べ
  board_size: null  # null または未設定でルール推奨値 (tic_tac_toe:3, connect6:19)
  symbols:
    empty: "_"
    black: "O"
    white: "X"
  first_player: 1  # 1=BLACK, -1=WHITE

network:
  architecture: "basic"
  basic:
    num_filters: 16
    num_blocks: 6
    policy_channels: 4
    value_channels: 4
  katago:
    num_filters: 128
    num_blocks: 10
    policy_channels: 32
    policy_global_hidden: 256
    value_hidden: 256
    value_mid_hidden: 64
    se_reduction: 4

mcts:
  dirichlet_alpha: 0.15
  dirichlet_weight: 0.25
  puct_c: 2.0
  temperature:
    initial: 0.7
    warmup_moves: 2
    decay_rate: 0.85
    min_value: 0.05
    endgame_move: 16
    endgame_temperature: 0.02
    endgame_slope: 3.0
    noise_scale: 0.01
  num_simulations_demo: 1000
  num_simulations_demo_mid: 3000
  num_simulations_train: 50

training:
  batch_size: 32
  num_epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  momentum: 0.75
  num_games: 500
  num_train_steps: 50
  vs_random_matches: 100
  scheduler:
    type: "cosine"
    cosine_min_lr: 1.0e-05
    onecycle_pct_start: 0.3
    onecycle_div_factor: 25.0
    onecycle_final_div_factor: 10000.0
  artifacts_dir: "artifacts"
  enable_tensorboard: true
  metrics_filename: "training_metrics.csv"
  latest_checkpoint: "latest.pt"
  best_checkpoint: "best.pt"
  replay_buffer:
    capacity: 500
    warmup_size: 128
    sample_size: 256
    recent_ratio: 0.2
